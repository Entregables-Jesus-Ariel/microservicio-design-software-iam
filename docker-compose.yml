services:
  postgres:
    image: postgres:16-alpine
    container_name: iam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: design_software
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d design_software"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: iam-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database:/workspace
    command:
      - --changelog-file=changelog/changelog-master.yaml
      - --search-path=/workspace
      - --url=jdbc:postgresql://postgres:5432/design_software
      - --username=postgres
      - --password=postgres
      - update

  backend:
    build:
      context: ./backend
    container_name: iam-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: design_software
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      APP_TOKEN_SECRET: cambia-este-secreto-en-produccion
      APP_TOKEN_TTL_MINUTES: "15"
      APP_HTTP_PORT: "8081"
      APP_CORS_ORIGIN: http://localhost:5173
      APP_READ_TIMEOUT_SECONDS: "10"
      APP_WRITE_TIMEOUT_SECONDS: "30"
      APP_DB_QUERY_TIMEOUT_SECONDS: "5"
    ports:
      - "8082:8081"

volumes:
  iam_postgres_data:
